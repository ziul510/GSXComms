version: 2

updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "13:00"
      timezone: "Etc/GMT+4"
    open-pull-requests-limit: 10
    ignore:
      # Update this binding with the bundled ONNX Runtime DLL
      - dependency-name: "github.com/yalue/onnxruntime_go"
    commit-message:
      prefix: "deps"

  # Rust SimConnect helper
  - package-ecosystem: "cargo"
    directory: "/cmd/gsxsimconnect"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "13:00"
      timezone: "Etc/GMT+4"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
