name: Third-party notices

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  license-check:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Set up Rust
        shell: pwsh
        run: rustup toolchain install 1.98.0 --profile minimal --target x86_64-pc-windows-msvc
      - name: Check release notices against the reviewed inventory
        shell: pwsh
        run: |
          $notices = Join-Path $env:RUNNER_TEMP 'THIRD_PARTY_NOTICES'
          $modules = Join-Path $env:RUNNER_TEMP 'licenses.csv'
          & ./scripts/notices.ps1 -Output $notices -ModuleReport $modules

          # Git returns 1 for a content difference
          $PSNativeCommandUseErrorActionPreference = $false
          $pairs = @{
            'THIRD_PARTY_NOTICES' = $notices
            'third_party/licenses.csv' = $modules
          }
          foreach ($path in ($pairs.Keys | Sort-Object)) {
            if (!(Test-Path -LiteralPath $path)) {
              "The next run on main will create $path." >> $env:GITHUB_STEP_SUMMARY
              continue
            }
            $diff = git diff --no-index --ignore-cr-at-eol -- $path $pairs[$path]
            if ($LASTEXITCODE -gt 1) { throw "Could not compare $path" }
            if ($LASTEXITCODE -eq 1) {
              @("## Changes in $path", '~~~diff') + $diff + '~~~' >> $env:GITHUB_STEP_SUMMARY
            }
          }

  regenerate:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Set up Rust
        shell: pwsh
        run: rustup toolchain install 1.98.0 --profile minimal --target x86_64-pc-windows-msvc
      - name: Regenerate release notices and module report
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force third_party | Out-Null
          & ./scripts/notices.ps1 -ModuleReport third_party/licenses.csv
      - name: Create pull request if changed
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: "chore: update third-party notices"
          title: "chore: update third-party notices"
          body: |
            Regenerate the Windows release notices and Go module report from the reviewed inventory.
          branch: chore/update-third-party-notices
          add-paths: |
            THIRD_PARTY_NOTICES
            third_party/licenses.csv
          delete-branch: true
