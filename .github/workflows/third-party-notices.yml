name: Third-party notices

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs on every PR, including Dependabot's. Blocks disallowed/unknown Go licenses
  # and reports both license changes and version bumps against third_party/licenses.csv.
  license-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install go-licenses
        shell: bash
        run: |
          set -euo pipefail
          GOROOT="$(go env GOROOT)"
          echo "GOROOT=$GOROOT" >> "$GITHUB_ENV"
          echo "$GOROOT/bin" >> "$GITHUB_PATH"
          export GOROOT
          export PATH="$GOROOT/bin:$PATH"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/google/go-licenses/v2@v2.0.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check Go licenses and diff against baseline
        shell: bash
        run: |
          set -euo pipefail
          export GOOS=windows
          export GOARCH=amd64
          export CGO_ENABLED=1

          IGNORE_ARGS=()
          while IFS= read -r mod; do
            [ -n "$mod" ] && IGNORE_ARGS+=(--ignore "$mod")
          done < <(go list -m)

          # Blocks forbidden, restricted (GPL/LGPL), and unknown licenses.
          # Remove ,restricted if weak-copyleft licenses should not fail the check.
          check_status=0
          if ! go-licenses check ./... "${IGNORE_ARGS[@]}" --disallowed_types=forbidden,restricted,unknown 2> "$RUNNER_TEMP/check.err"; then
            check_status=$?
          fi
          cat "$RUNNER_TEMP/check.err" >&2

          printf '%s' '{{ range . }}{{ .Name }},{{ .Version }},{{ .LicenseName }}{{ "\n" }}{{ end }}' > "$RUNNER_TEMP/report.tpl"
          report_status=0
          if ! go-licenses report ./... "${IGNORE_ARGS[@]}" --template "$RUNNER_TEMP/report.tpl" > "$RUNNER_TEMP/licenses-body.csv" 2> "$RUNNER_TEMP/report.err"; then
            report_status=$?
            cat "$RUNNER_TEMP/report.err" >&2
          fi

          if [ "$report_status" -eq 0 ]; then
            {
              echo "Module,Version,License"
              LC_ALL=C sort "$RUNNER_TEMP/licenses-body.csv"
            } > "$RUNNER_TEMP/licenses-now.csv"

            if [ ! -f third_party/licenses.csv ]; then
              {
                echo "## License baseline missing"
                echo
                echo "\`third_party/licenses.csv\` does not exist yet. Run this workflow manually on \`main\` (or merge this PR so the workflow opens a PR with the initial baseline and Go notices)."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              tr -d '\r' < third_party/licenses.csv > "$RUNNER_TEMP/licenses-base.csv"

              awk -F, 'NR>1 { if (NF>=3) { mod=$1; line=$0; sub(/^[^,]*,[^,]*,/, "", line); print mod "," line } else if (NF==2) { print $1 "," $2 } }' \
                "$RUNNER_TEMP/licenses-base.csv" | LC_ALL=C sort > "$RUNNER_TEMP/base-lic.csv"
              awk -F, 'NR>1 { if (NF>=3) { mod=$1; line=$0; sub(/^[^,]*,[^,]*,/, "", line); print mod "," line } else if (NF==2) { print $1 "," $2 } }' \
                "$RUNNER_TEMP/licenses-now.csv" | LC_ALL=C sort > "$RUNNER_TEMP/now-lic.csv"

              if ! diff -u "$RUNNER_TEMP/base-lic.csv" "$RUNNER_TEMP/now-lic.csv" > "$RUNNER_TEMP/lic-only.diff"; then
                {
                  echo "## Go dependency or license changes detected"
                  echo
                  echo "A Go dependency was added, removed, or changed license compared to \`third_party/licenses.csv\`."
                  echo '```diff'
                  cat "$RUNNER_TEMP/lic-only.diff"
                  echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
              else
                {
                  echo "## No Go license changes detected"
                  echo
                  echo "All Go module licenses match \`third_party/licenses.csv\` (Go \`windows/amd64\` scope; Rust crates and manual assets are not scanned by \`go-licenses\`)."
                } >> "$GITHUB_STEP_SUMMARY"
              fi

              if ! diff -u "$RUNNER_TEMP/licenses-base.csv" "$RUNNER_TEMP/licenses-now.csv" > "$RUNNER_TEMP/licenses.diff"; then
                {
                  echo
                  echo "### Go dependency version / baseline diff (informational)"
                  echo "Baseline (\`third_party/licenses.csv\`) and the Go section of \`THIRD_PARTY_NOTICES\` will be updated automatically via PR after merge to \`main\`."
                  echo '```diff'
                  cat "$RUNNER_TEMP/licenses.diff"
                  echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          else
            echo "::error::Failed to generate Go license report. See job log and step summary for details."
            {
              echo
              echo "## Failed to generate Go license report"
              echo '```'
              cat "$RUNNER_TEMP/report.err"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$check_status" -ne 0 ]; then
            echo "::error::Disallowed or unknown Go dependency license(s) detected. See job log and step summary for details."
            {
              echo
              echo "## Disallowed or unknown Go licenses detected"
              echo '```'
              cat "$RUNNER_TEMP/check.err"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$check_status"
          fi

          if [ "$report_status" -ne 0 ]; then
            exit "$report_status"
          fi

  # Runs on pushes to main and on manual runs.
  # Rebuilds third_party/licenses.csv and updates ONLY the Go modules section inside
  # THIRD_PARTY_NOTICES, leaving non-Go, model, asset, and Rust sections intact.
  regenerate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install go-licenses
        shell: bash
        run: |
          set -euo pipefail
          GOROOT="$(go env GOROOT)"
          echo "GOROOT=$GOROOT" >> "$GITHUB_ENV"
          echo "$GOROOT/bin" >> "$GITHUB_PATH"
          export GOROOT
          export PATH="$GOROOT/bin:$PATH"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/google/go-licenses/v2@v2.0.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Regenerate Go baseline and update THIRD_PARTY_NOTICES
        shell: bash
        run: |
          set -euo pipefail
          export GOOS=windows
          export GOARCH=amd64
          export CGO_ENABLED=1

          if [ ! -f THIRD_PARTY_NOTICES ]; then
            echo "::error::THIRD_PARTY_NOTICES not found at repository root." >&2
            exit 1
          fi

          IGNORE_ARGS=()
          while IFS= read -r mod; do
            [ -n "$mod" ] && IGNORE_ARGS+=(--ignore "$mod")
          done < <(go list -m)

          SAVE_DIR="$RUNNER_TEMP/licenses"
          mkdir -p third_party

          printf '%s' '{{ range . }}{{ .Name }},{{ .Version }},{{ .LicenseName }}{{ "\n" }}{{ end }}' > "$RUNNER_TEMP/report.tpl"
          go-licenses report ./... "${IGNORE_ARGS[@]}" --template "$RUNNER_TEMP/report.tpl" \
            | LC_ALL=C sort > "$RUNNER_TEMP/licenses-body.csv"

          {
            echo "Module,Version,License"
            cat "$RUNNER_TEMP/licenses-body.csv"
          } > third_party/licenses.csv

          go-licenses save ./... "${IGNORE_ARGS[@]}" --save_path="$SAVE_DIR" --force

          {
            echo "=== BEGIN GO MODULES ==="
            first=1
            while IFS=, read -r module version license; do
              license="${license%$'\r'}"
              [ -n "$module" ] || continue
              if [ "$first" -eq 0 ]; then
                echo
              fi
              first=0
              if [ -n "$version" ]; then
                echo "========== $module $version ($license) =========="
              else
                echo "========== $module ($license) =========="
              fi
              if [ ! -d "$SAVE_DIR/$module" ]; then
                echo "::error::No saved license directory found for $module at $SAVE_DIR/$module (license: $license)." >&2
                exit 1
              fi
              mapfile -d '' -t files < <(
                find -L "$SAVE_DIR/$module" -maxdepth 1 -type f ! -iname '*.go' \
                  \( -iname 'license*' -o -iname 'licence*' -o -iname 'copying*' -o -iname 'notice*' -o -iname 'patents*' -o -iname 'unlicense*' -o -iname 'unlicence*' \) \
                  -print0 | LC_ALL=C sort -z
              )
              if [ ${#files[@]} -eq 0 ]; then
                mapfile -d '' -t files < <(
                  find -L "$SAVE_DIR/$module" -maxdepth 1 -type f ! -iname '*.go' -iname 'readme*' -print0 | LC_ALL=C sort -z
                )
              fi
              if [ ${#files[@]} -eq 0 ]; then
                echo "::error::No license or notice files found for $module in $SAVE_DIR/$module" >&2
                exit 1
              fi
              f_idx=0
              for f in "${files[@]}"; do
                if [ "$f_idx" -gt 0 ]; then
                  echo
                fi
                f_idx=$((f_idx + 1))
                cat "$f"
                if [ -s "$f" ] && [ -n "$(tail -c 1 "$f")" ]; then
                  echo
                fi
              done

              # Preserve embedded SIL OFL-1.1 font notice inside chroma/v2
              if [ "$module" = "github.com/alecthomas/chroma/v2" ]; then
                chroma_dir="$(go list -m -f '{{.Dir}}' github.com/alecthomas/chroma/v2 2>/dev/null || true)"
                font_file="$chroma_dir/formatters/svg/font_liberation_mono.go"
                if [ -f "$font_file" ]; then
                  echo
                  echo "// formatters/svg/font_liberation_mono.go"
                  echo
                  awk '
                    /^package / { exit }
                    NR == 1 && /^\/\*/ { sub(/^\/\*/, ""); if ($0 == "") next }
                    /\*\/$/ { sub(/\*\/$/, ""); if ($0 != "") print; next }
                    { print }
                  ' "$font_file"
                fi
              fi
            done < "$RUNNER_TEMP/licenses-body.csv"
            echo "=== END GO MODULES ==="
          } > "$RUNNER_TEMP/go-notices.txt"

          python3 - "$RUNNER_TEMP/go-notices.txt" <<'PY'
          from pathlib import Path
          import sys

          notices_path = Path("THIRD_PARTY_NOTICES")
          go_block_path = Path(sys.argv[1])

          raw = notices_path.read_bytes()
          use_crlf = b"\r\n" in raw
          text = raw.decode("utf-8").replace("\r\n", "\n")
          lines = text.splitlines(keepends=True)
          go_block = go_block_path.read_text(encoding="utf-8").replace("\r\n", "\n").rstrip("\n") + "\n"

          begin_lines = [i for i, l in enumerate(lines) if l.rstrip("\n") == "=== BEGIN GO MODULES ==="]
          end_lines = [i for i, l in enumerate(lines) if l.rstrip("\n") == "=== END GO MODULES ==="]

          if len(begin_lines) == 1 and len(end_lines) == 1 and begin_lines[0] < end_lines[0]:
              new_text = "".join(lines[:begin_lines[0]]) + go_block + "".join(lines[end_lines[0] + 1:])
          elif not begin_lines and not end_lines:
              first_go = next((i for i, l in enumerate(lines) if l.startswith("========== ")), None)
              stdlib_idx = next((i for i, l in enumerate(lines) if l.rstrip("\n") == "========== Go standard library and runtime =========="), None)
              if first_go is not None and stdlib_idx is not None and first_go < stdlib_idx:
                  new_text = "".join(lines[:first_go]) + go_block + "\n" + "".join(lines[stdlib_idx:])
              else:
                  sys.stderr.write(
                      "::error::Could not locate === BEGIN GO MODULES === / === END GO MODULES === "
                      "markers (or initial Go module block before Go standard library) in THIRD_PARTY_NOTICES.\n"
                  )
                  sys.exit(1)
          else:
              sys.stderr.write(
                  "::error::Malformed or duplicate === BEGIN GO MODULES === / === END GO MODULES === markers in THIRD_PARTY_NOTICES.\n"
              )
              sys.exit(1)

          if use_crlf:
              new_text = new_text.replace("\n", "\r\n")
          notices_path.write_bytes(new_text.encode("utf-8"))
          PY

      - name: Create pull request if changed
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: "chore: update third-party notices"
          title: "chore: update third-party notices"
          body: |
            Automated update of `third_party/licenses.csv` and the Go modules section of `THIRD_PARTY_NOTICES` by the Third-party notices workflow.
          branch: chore/update-third-party-notices
          add-paths: |
            THIRD_PARTY_NOTICES
            third_party/licenses.csv
          delete-branch: true
