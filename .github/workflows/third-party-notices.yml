name: Third-party notices

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs on every PR, including Dependabot's. Fails on disallowed/unknown licenses
  # and posts an informational diff against the committed baseline.
  license-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install go-licenses
        shell: bash
        run: |
          set -euo pipefail
          GOROOT="$(go env GOROOT)"
          echo "GOROOT=$GOROOT" >> "$GITHUB_ENV"
          echo "$GOROOT/bin" >> "$GITHUB_PATH"
          export GOROOT
          export PATH="$GOROOT/bin:$PATH"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/google/go-licenses/v2@v2.0.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check licenses and diff against baseline
        shell: bash
        run: |
          set -euo pipefail
          IGNORE_ARGS=()
          while IFS= read -r mod; do
            [ -n "$mod" ] && IGNORE_ARGS+=(--ignore "$mod")
          done < <(go list -m)

          # Fail on forbidden or unknown licenses (add ,restricted or ,reciprocal to tighten policy).
          check_status=0
          go-licenses check ./... "${IGNORE_ARGS[@]}" --disallowed_types=forbidden,unknown \
            2> "$RUNNER_TEMP/check.err" || check_status=$?
          cat "$RUNNER_TEMP/check.err" >&2

          go-licenses report ./... "${IGNORE_ARGS[@]}" \
            | awk -F, '{print $1 "," $3}' | LC_ALL=C sort > "$RUNNER_TEMP/licenses-now.csv"

          if [ ! -f third_party/licenses.csv ]; then
            {
              echo "## License baseline missing"
              echo
              echo "\`third_party/licenses.csv\` does not exist yet. Run the workflow manually on \`main\` (or merge this PR) to generate it."
            } >> "$GITHUB_STEP_SUMMARY"
          elif ! diff -u third_party/licenses.csv "$RUNNER_TEMP/licenses-now.csv" > "$RUNNER_TEMP/licenses.diff"; then
            {
              echo "## License changes detected (informational)"
              echo
              echo "Review before merging. Lines starting with \`-\` are the baseline, \`+\` lines are this PR."
              echo "Baseline and \`THIRD_PARTY_NOTICES\` will be regenerated automatically after merge."
              echo '```diff'
              cat "$RUNNER_TEMP/licenses.diff"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No license changes compared to baseline." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$check_status" -ne 0 ]; then
            echo "::error::Disallowed or unknown dependency license(s) detected. See job log and step summary for details."
            {
              echo
              echo "## Disallowed or unknown licenses detected"
              echo '```'
              cat "$RUNNER_TEMP/check.err"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$check_status"
          fi

  # Runs on pushes to main and on manual runs.
  # Rebuilds the baseline and notices file and opens a PR if anything changed.
  # Note: go-licenses resolves dependencies for the runner OS/arch (linux/amd64).
  # If you distribute macOS or Windows binaries, run per target GOOS/GOARCH.
  regenerate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install go-licenses
        shell: bash
        run: |
          set -euo pipefail
          GOROOT="$(go env GOROOT)"
          echo "GOROOT=$GOROOT" >> "$GITHUB_ENV"
          echo "$GOROOT/bin" >> "$GITHUB_PATH"
          export GOROOT
          export PATH="$GOROOT/bin:$PATH"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/google/go-licenses/v2@v2.0.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Regenerate baseline and notices
        shell: bash
        run: |
          set -euo pipefail
          IGNORE_ARGS=()
          while IFS= read -r mod; do
            [ -n "$mod" ] && IGNORE_ARGS+=(--ignore "$mod")
          done < <(go list -m)

          SAVE_DIR="$RUNNER_TEMP/licenses"
          mkdir -p third_party

          go-licenses report ./... "${IGNORE_ARGS[@]}" \
            | awk -F, '{print $1 "," $3}' | LC_ALL=C sort > third_party/licenses.csv
          go-licenses save ./... "${IGNORE_ARGS[@]}" --save_path="$SAVE_DIR" --force

          {
            echo "THIRD-PARTY SOFTWARE NOTICES"
            echo
            echo "This software includes the third-party Go modules listed below, used under their licenses."
            while IFS=, read -r module license; do
              [ -n "$module" ] || continue
              echo
              echo "================================================================"
              echo "$module"
              echo "License: $license"
              echo "================================================================"
              if [ ! -d "$SAVE_DIR/$module" ]; then
                echo "::error::No saved license directory found for $module at $SAVE_DIR/$module" >&2
                exit 1
              fi
              mapfile -d '' -t files < <(
                find -L "$SAVE_DIR/$module" -maxdepth 1 -type f \
                  \( -iname 'license*' -o -iname 'licence*' -o -iname 'copying*' -o -iname 'notice*' -o -iname 'patents*' -o -iname 'unlicense*' \) \
                  -print0 | LC_ALL=C sort -z
              )
              if [ ${#files[@]} -eq 0 ]; then
                mapfile -d '' -t files < <(
                  find -L "$SAVE_DIR/$module" -maxdepth 1 -type f -iname 'readme*' -print0 | LC_ALL=C sort -z
                )
              fi
              if [ ${#files[@]} -eq 0 ]; then
                echo "::error::No license or notice files found for $module in $SAVE_DIR/$module" >&2
                exit 1
              fi
              for f in "${files[@]}"; do
                echo "--- $(basename "$f") ---"
                cat "$f"
                echo
              done
            done < third_party/licenses.csv
          } > THIRD_PARTY_NOTICES

      - name: Create pull request if changed
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: "chore: update third-party notices"
          title: "chore: update third-party notices"
          body: |
            Automated update of `third_party/licenses.csv` and `THIRD_PARTY_NOTICES` by the Third-party notices workflow.
          branch: chore/update-third-party-notices
          add-paths: |
            THIRD_PARTY_NOTICES
            third_party/licenses.csv
          delete-branch: true
