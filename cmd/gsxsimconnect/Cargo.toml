[package]
name = "gsxsimconnect"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
simconnect = { package = "flybywireless-simconnect", version = "=0.2.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[profile.release]
strip = true
lto = true
